<script>
(()=>{
const root=document.getElementById('rope-game'),canvas=root.querySelector('#board'),baseCtx=canvas.getContext('2d');let ctx=baseCtx;
const tubeCanvas=document.createElement('canvas'),knobCanvas=document.createElement('canvas');
for(const layer of [tubeCanvas,knobCanvas]){layer.width=1200;layer.height=1200;layer.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';layer.setAttribute('aria-hidden','true');canvas.parentNode.appendChild(layer)}
const knobCtx=knobCanvas.getContext('2d');root.querySelector('#toast').style.zIndex=3;

const status=root.querySelector('#status'),counter=root.querySelector('#count'),undoBtn=root.querySelector('#undo'),toast=root.querySelector('#toast');
const prefs=storageRead('vespera-untangle-preferences-v2',{});
let gameMode=prefs.mode==='free'?'free':'challenge',timed=prefs.timed!==false,played=false,assisted=false,recorded=false,elapsed=0,timerStarted=0,returning=false;
const SAVE_PREFIX='vespera-untangle-progress-v2-',RECORD_KEY='vespera-untangle-records-v2';
let ropeCount=gameMode==='free'?5:8,N=48;const R=8.1,SEP=R*2+.7,HOLEZ=10;
const colors=[['#087bd4','#41c5ff','#004c8d'],['#dd528e','#ffacd1','#963055'],['#dfa341','#ffe49b','#9d681f'],['#238c6b','#7ce2ae','#105344'],['#8854c9','#d3adff','#52327d'],['#e16440','#ffb994','#963e27'],['#24a7b5','#98f4f1','#17616b'],['#9aa42b','#edf394','#5b6518']];
const holes=[];for(let x=140;x<=460;x+=80)holes.push({x,y:60});for(let y=140;y<=460;y+=80)holes.push({x:540,y});for(let x=460;x>=140;x-=80)holes.push({x,y:540});for(let y=460;y>=140;y-=80)holes.push({x:60,y});holes.push({x:140,y:140},{x:460,y:140},{x:460,y:460},{x:140,y:460});
let generating=false,generationSerial=0,opening=null,guardStops=0,ropes=[],history=[],moves=0,selected=null,drag=null,pointer=null,hoverHole=-1,demoMode=false,won=false,quiet=0;
const boardPath=new Path2D('M120 20H480Q500 20 500 40V100H560Q580 100 580 120V480Q580 500 560 500H500V560Q500 580 480 580H120Q100 580 100 560V500H40Q20 500 20 480V120Q20 100 40 100H100V40Q100 20 120 20Z M190 100H410Q420 100 420 110V170Q420 180 430 180H490Q500 180 500 190V410Q500 420 490 420H430Q420 420 420 430V490Q420 500 410 500H190Q180 500 180 490V430Q180 420 170 420H110Q100 420 100 410V190Q100 180 110 180H170Q180 180 180 170V110Q180 100 190 100Z');
const bg=document.createElement('canvas');bg.width=1200;bg.height=1200;const b=bg.getContext('2d');b.scale(2,2);
let seed=123;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
b.fillStyle='#eeeae1';b.fillRect(0,0,600,600);for(let i=0;i<420;i++){const x=rand()*600;b.strokeStyle=`rgba(130,119,93,${rand()*.045})`;b.lineWidth=rand()*1.2;b.beginPath();b.moveTo(x,0);b.bezierCurveTo(x+rand()*4,200,x-rand()*4,400,x,600);b.stroke()}
b.save();b.shadowColor='#253f3d65';b.shadowBlur=10;b.shadowOffsetY=5;b.fillStyle='#93afaa';b.fill(boardPath,'evenodd');b.restore();b.save();b.clip(boardPath,'evenodd');b.fillStyle='#bdc7bb';b.fillRect(0,0,600,600);
for(let y=0;y<600;y+=22)for(let x=0;x<600;x+=25){const xx=x+(y%44?12:0),j=()=>rand()*7-3.5;b.beginPath();b.moveTo(xx+j(),y+j());b.lineTo(xx+22+j(),y+j());b.lineTo(xx+23+j(),y+19+j());b.lineTo(xx+j(),y+20+j());b.closePath();b.fillStyle=['#94b1aa','#a8c0b7','#7e9f9a','#c3cfc2','#b0c1b5'][Math.floor(rand()*5)];b.fill();b.strokeStyle='#e0dfce';b.lineWidth=1.3;b.stroke()}b.restore();b.strokeStyle='#385957';b.lineWidth=2;b.stroke(boardPath);
function project(p){return{x:p.x,y:p.y-p.z*.52}}
function point(x,y,z=10){return{x,y,z,ox:x,oy:y,oz:z}}
function snapshot(){return{count:ropeCount,ropes:ropes.map(r=>({ends:r.ends.slice(),rest:r.rest,cleared:!!r.cleared,p:r.p.map(p=>({...p}))})),moves,demoMode}}
function restore(s){if(s.count){ropeCount=s.count;N=48}ropes=s.ropes.map((r,i)=>({...r,ends:r.ends.slice(),p:r.p.map(p=>({...p})),color:colors[i],freeSince:null}));moves=s.moves;demoMode=s.demoMode;selected=null;drag=null;pointer=null;returning=false;won=false;quiet=0;toast.className='';updateMode();update()}
function shuffled(values){const result=values.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function relaxGenerated(list){
// Initial arrangement has no prior topology to preserve. Separate capsules before
// entering the live solver, which subsequently preserves continuous motion.
for(let pass=0;pass<24;pass++){
for(const [A,B]of nearbyPairs(list,null,true)){const i=A.i,j=B.i;collide(A.a,A.b,B.a,B.b,i?1:0,i+1===N?0:1,j?1:0,j+1===N?0:1)}
for(const r of list)for(let i=1;i<N;i++){const p=r.p[i];p.x=Math.max(30,Math.min(570,p.x));p.y=Math.max(30,Math.min(570,p.y));p.z=Math.max(R,p.z)}
}
for(const r of list){let length=0;for(let i=0;i<=N;i++){const p=r.p[i];p.ox=p.x;p.oy=p.y;p.oz=p.z;if(i)length+=Math.hypot(p.x-r.p[i-1].x,p.y-r.p[i-1].y,p.z-r.p[i-1].z)}r.rest=length/N}
}
function makeOpening(){
// Every hole is eligible. Pairing is independently shuffled, with no rows,
// opposite-side constraint, shared winding axis, or repeated spiral template.
const occupied=shuffled(holes.map((_,i)=>i)).slice(0,ropeCount*2),pairs=shuffled(occupied);
const hubCount=2+Math.floor(Math.random()*3),cx=270+Math.random()*60,cy=270+Math.random()*60,spread=42+Math.random()*32;
const hubs=Array.from({length:hubCount},()=>({x:cx+(Math.random()*2-1)*spread,y:cy+(Math.random()*2-1)*spread}));
const result=[],routes=[];
function catmull(points,t){const i=Math.min(points.length-2,Math.floor(t)),u=t-i,a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],d=points[Math.min(points.length-1,i+2)],q={};for(const axis of ['x','y','z'])q[axis]=.5*(2*b[axis]+(-a[axis]+c[axis])*u+(2*a[axis]-5*b[axis]+4*c[axis]-d[axis])*u*u+(-a[axis]+3*b[axis]-3*c[axis]+d[axis])*u*u*u);return q}
for(let k=0;k<ropeCount;k++){
const ends=[pairs[k*2],pairs[k*2+1]],a=holes[ends[0]],b=holes[ends[1]],order=shuffled(hubs);
// Independently ordered visits create crossings and reversals. Depth at each
// visit is random too, so one rope can pass both above and below another.
if(order.length===2||Math.random()<.6)order.splice(1+Math.floor(Math.random()*order.length),0,hubs[Math.floor(Math.random()*hubs.length)]);
const controls=order.map(h=>({x:h.x+(Math.random()*2-1)*22,y:h.y+(Math.random()*2-1)*22,z:18+Math.random()*112}));
routes.push(controls.map(p=>[Math.round(p.x),Math.round(p.y),Math.round(p.z)]));
const pts=[];for(let i=0;i<=N;i++){const t=i/N;let q;
if(t<.20){const u=t/.20,c=controls[0];q={x:a.x+(c.x-a.x)*u,y:a.y-HOLEZ*.52+(c.y-a.y+HOLEZ*.52)*u,z:HOLEZ+(c.z-HOLEZ)*u}}
else if(t>.80){const u=(t-.80)/.20,c=controls[controls.length-1];q={x:c.x+(b.x-c.x)*u,y:c.y+(b.y-HOLEZ*.52-c.y)*u,z:c.z+(HOLEZ-c.z)*u}}
else q=catmull(controls,(t-.20)/.60*(controls.length-1));
q.y+=q.z*.52;pts.push(point(Math.max(30,Math.min(570,q.x)),Math.max(30,Math.min(570,q.y)),Math.max(R,q.z)))}
const lengths=[0];for(let i=1;i<pts.length;i++)lengths.push(lengths[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y,pts[i].z-pts[i-1].z));const total=lengths[lengths.length-1],uniform=[];let segment=0;
for(let i=0;i<=N;i++){const distance=total*i/N;while(segment<pts.length-2&&lengths[segment+1]<distance)segment++;const u=(distance-lengths[segment])/(lengths[segment+1]-lengths[segment]||1),a=pts[segment],b=pts[segment+1];uniform.push(point(a.x+(b.x-a.x)*u,a.y+(b.y-a.y)*u,a.z+(b.z-a.z)*u))}
result.push({p:uniform,ends,rest:total/N,color:colors[k],cleared:false,freeSince:null});
}
relaxGenerated(result);
return{count:ropeCount,ropes:result,moves:0,demoMode:false,word:{type:'random-routes',hubs:hubCount,routes}};
}
function updateSlots(){const cleared=gameMode==='free'?ropeCrossings().filter(n=>n===0).length:ropes.filter(r=>r.cleared).length;root.querySelector('#slots').textContent='已解开 '+cleared+'/'+ropeCount;canvas.dataset.cleared=String(cleared)}
function updateMode(){
try{localStorage.setItem('vespera-untangle-preferences-v2',JSON.stringify({mode:gameMode,timed}))}catch{}
root.querySelector('h1').textContent=gameMode==='free'?'自由，慢慢玩。':'八根，来点难度。';
root.querySelector('#mode-label').textContent=gameMode==='free'?'自由模式':'八根闯关';
root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===gameMode)));
root.querySelector('#free-tools').hidden=gameMode!=='free';root.querySelector('#timing-options').hidden=gameMode==='free';
root.querySelector('#timer').hidden=gameMode==='free'||!timed;root.querySelector('.round-tools').hidden=gameMode==='free'||!timed;root.querySelector('#records').hidden=gameMode==='free';
const timingSwitch=root.querySelector('#timing-options');timingSwitch.dataset.timed=String(timed);timingSwitch.setAttribute('aria-checked',String(timed));timingSwitch.disabled=generating||played;
root.querySelector('#add-rope').disabled=generating||ropeCount>=8;root.querySelector('#remove-rope').disabled=generating||ropeCount<=1;
updateSlots();canvas.setAttribute('aria-label',ropeCount+'根绳子的解缠棋盘，按住彩色绳头拖至灰色空孔。');
}
function storageRead(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function removeSave(){try{localStorage.removeItem(SAVE_PREFIX+gameMode)}catch{}}
function timerValue(){return elapsed+(timerStarted?performance.now()-timerStarted:0)}
function pauseTimer(){elapsed=timerValue();timerStarted=0}
function resumeTimer(){if(played&&timed&&gameMode==='challenge'&&!won&&!generating&&!document.hidden&&!timerStarted)timerStarted=performance.now()}
function formatTime(ms){const seconds=Math.floor(ms/1000),m=Math.floor(seconds/60),sec=seconds%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
function markPlayed(){if(!played){played=true;resumeTimer();updateMode()}}

function returnTo(snap,moved){if(!moved){restore(snap);return}returning={start:performance.now(),from:snapshot(),to:snap};quiet=0}

canvas.style.cursor='grab';
root.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{const next=button.dataset.mode;root.querySelector('#mode-picker').open=false;if(next===gameMode||generating||pointer||returning)return;pauseTimer();saveProgress();gameMode=next;opening=null;history=[];played=false;elapsed=0;assisted=false;won=false;ropeCount=next==='challenge'?8:5;N=48;if(!loadProgress()){updateMode();beginOpening()}});
