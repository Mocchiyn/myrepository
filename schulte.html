/* Full-width board and a separate records screen. */
body{padding:16.8px 11.2px 36px}
.playfield{display:flex;flex-direction:column;gap:13px}
.board-wrapper{width:100%;align-self:stretch}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:10px 0 0;border-top:1px solid #546046}
.stat{display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 13px}
.stat:first-child{padding-left:0;border-right:1px solid #67745366}

.screen-caption{margin:11px 0 12px}

.records-dialog .records-panel{border:0;padding:0}

.dialog-footer{display:flex;justify-content:flex-end;border-top:1px solid #546046;margin-top:18px;padding-top:10px}

/* Four short, discrete burst frames; decorative only, never intercepts a tap. */
.bubble-pop{position:absolute;pointer-events:none;color:var(--ink);z-index:3;overflow:visible}
.bubble-pop svg{display:block;width:100%;height:100%;overflow:visible}

<dialog id="recordsDialog" class="records-dialog" aria-labelledby="recordsTitle">
  <div class="records-inner">
    <div class="dialog-heading"><div><h2 id="recordsTitle">历史记录</h2><small>PERSONAL BEST / TOP 05</small></div><button id="closeRecords" type="button" autofocus>返回</button></div>
    <section class="records-panel"><div class="records-head"><h2>BEST / 最佳记录</h2><span id="recordSizeLabel">5 × 5</span></div><ol id="records"></ol></section>
    <p class="records-note">按当前棋盘尺寸显示最快的 5 次成绩</p>
    <div class="dialog-footer"><button id="clearRecords" class="pixel-btn" type="button">清空当前尺寸记录</button></div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

class DriftField {
  constructor(arena, numbers, onHit) {
    this.arena = arena;
    this.onHit = onHit;
    this.balls = [];
    this.dense = numbers.length === 36;
    this.large = numbers.length === 9;
    this.raf = 0;
    this.last = 0;
    this.running = true;
    this.resize = () => this.layout();
    arena.innerHTML = '';
    numbers.forEach(n => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'drift-ball';
      el.textContent = n; el.dataset.n = n;
      el.setAttribute('aria-label', '数字 ' + n);
      // Pointerdown judges the number before it can drift away from the finger.
      el.addEventListener('pointerdown', e => {
        if (e.button !== 0 || !e.isPrimary) return;
        e.preventDefault(); onHit({currentTarget: el});
      });
      el.addEventListener('click', e => {
        if (e.detail === 0 && !el.disabled) onHit({currentTarget: el});
      });
      const angle = Math.random() * Math.PI * 2;
      const speed = (18 + Math.random() * 10) * (this.dense ? 1.035 : 1.1) * 1.05;
      this.balls.push({n, el, x:0, y:0, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed});
      arena.appendChild(el);
    });
    this.layout();
    this.observer = new ResizeObserver(this.resize);
    this.observer.observe(arena);
    this.frame = now => {
      if (!this.running) return;
      const dt = this.last ? Math.min((now-this.last)/1000, .035) : 0;
      this.last = now;
      this.step(dt); this.paint();
      this.raf = requestAnimationFrame(this.frame);
    };
    this.raf = requestAnimationFrame(this.frame);
  }
  layout() {
    const w = this.arena.clientWidth, h = this.arena.clientHeight;
    if (!w || !h) return;
    this.w = w; this.h = h;
    const cols = Math.ceil(Math.sqrt(this.balls.length || 1));
    this.d = this.dense
      ? Math.min(48, Math.max(34, (w-16)/cols*.74), (w-12)/cols-3, (h-16)/cols*.74)
      : Math.min(this.large ? 59 : 54, (w-16)/cols*.76, (h-16)/cols*.76) * (this.large ? 1.15 : 1);
    const rows = Math.ceil(this.balls.length/cols);
    this.balls.forEach((b,i) => {
      b.x = (i%cols+.5)*w/cols-this.d/2;
      b.y = (Math.floor(i/cols)+.5)*h/rows-this.d/2;
      b.el.style.width = b.el.style.height = this.d+'px';
      b.el.style.fontSize = Math.min(25, this.d*.47)+'px';
    });
    this.paint(); this.resetClock();
  }
  step(dt) {
    const d = this.d, maxX=this.w-d, maxY=this.h-d;
    if (!(maxX>0 && maxY>0)) return;
    const clamp = b => {
      if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}
      if(b.x>maxX){b.x=maxX;b.vx=-Math.abs(b.vx)}
      if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}
      if(b.y>maxY){b.y=maxY;b.vy=-Math.abs(b.vy)}
    };
    this.balls.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;clamp(b)});
    // Equal-size circles gently bounce and separate instead of covering each other.
    for(let pass=0;pass<5;pass++) {
      for(let i=0;i<this.balls.length;i++) for(let j=i+1;j<this.balls.length;j++) {
        const a=this.balls[i],b=this.balls[j];
        const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
        if(dist>=d+2) continue;
        const nx=dist ? dx/dist : 1, ny=dist ? dy/dist : 0;
        const push=(d+2-dist)/2;
        a.x-=nx*push;a.y-=ny*push;b.x+=nx*push;b.y+=ny*push;
        const closing=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
        if(closing>0){a.vx-=closing*nx;a.vy-=closing*ny;b.vx+=closing*nx;b.vy+=closing*ny}
      }
      this.balls.forEach(clamp);
    }
  }
  paint(){this.balls.forEach(b=>b.el.style.transform='translate('+b.x+'px,'+b.y+'px)')}
  remove(n) {
    const i = this.balls.findIndex(b => b.n === n);
    if (i < 0) return;
    const ball = this.balls[i];
    const pop = document.createElement('div');
    pop.className = 'bubble-pop';
    pop.setAttribute('aria-hidden', 'true');
    pop.style.left = ball.x + 'px'; pop.style.top = ball.y + 'px';
    pop.style.width = pop.style.height = this.d + 'px';
    pop.innerHTML = '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle class="pop-ring" cx="50" cy="50" r="39"/><g class="pop-rays"><path d="M50 5v12 M50 83v12 M5 50h12 M83 50h12 M18 18l9 9 M73 73l9 9 M18 82l9-9 M73 27l9-9"/></g></svg>';
    this.arena.appendChild(pop);
    // Remove from physics and hit testing immediately; only the visual lingers.
    ball.el.remove(); this.balls.splice(i, 1);
    setTimeout(() => pop.remove(), 260);
  }
  resetClock(){this.last=0}
  stop(){this.running=false;cancelAnimationFrame(this.raf)}
  destroy(){this.stop();this.observer.disconnect();this.arena.innerHTML=''}
}

(function () {
  'use strict';

  const STORAGE_KEY = 'schulte-records-custom-v1';
  const MAX_RECORDS = 5;

  const boardEl = document.getElementById('board');
  const boardWrapper = document.getElementById('boardWrapper');
  const timerEl = document.getElementById('timer');
  const timerToggle = document.getElementById('toggleTimer');
  const nextEl = document.getElementById('next');
  const errorsEl = document.getElementById('errors');
  const recordsEl = document.getElementById('records');
  const bestRecordEl = document.getElementById('bestRecord');
  const recordsDialog = document.getElementById('recordsDialog');
  document.getElementById('viewRecords').addEventListener('click', () => recordsDialog.showModal());
  document.getElementById('closeRecords').addEventListener('click', () => recordsDialog.close());
  recordsDialog.addEventListener('click', e => { if (e.target === recordsDialog) { const rect = recordsDialog.getBoundingClientRect(); if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) recordsDialog.close(); } });
  const recordSizeLabel = document.getElementById('recordSizeLabel');
  
  const selectTrigger = document.getElementById('selectTrigger');
  const selectOptions = document.getElementById('selectOptions');
  
  const restartBtn = document.getElementById('restart');
  const clearBtn = document.getElementById('clearRecords');
  const toastEl = document.getElementById('toast');

  let mode = 'classic';
  let size = 5;
  let drift = null;
  const arena = document.getElementById('driftArena');
  const driftHud = document.getElementById('driftHud');
  const modeSwitch = document.getElementById('modeSwitch');
  const statsEl = document.querySelector('.stats');
  const bestSummary = document.querySelector('.best-summary');
  const classicScreenTop = document.querySelector('.screen-top');
  const classicPlayfield = document.querySelector('.playfield');
  const classicScreen = document.querySelector('.screen');
  let total = size * size;
  let next = 1;
  let errors = 0;
  let started = false;
  let finished = false;
  let startTime = 0;
  let rafId = 0;
  let newRecordTs = 0;
  let timerHidden = false;

  function updateTimerVisibility(forceShow = false) {
    const hidden = timerHidden && !forceShow;
    timerToggle.classList.toggle('time-hidden', hidden);
    timerToggle.setAttribute('aria-pressed', String(hidden));
    timerToggle.setAttribute('aria-label', hidden ? '显示计时' : '隐藏计时');
    timerEl.setAttribute('aria-hidden', String(hidden));
  }

  timerToggle.addEventListener('click', function () {
    timerHidden = !timerToggle.classList.contains('time-hidden');
    updateTimerVisibility();
  });

  const fmtSec = ms => (ms / 1000).toFixed(2);

  /* ---------- 下拉菜单 ---------- */
  selectTrigger.addEventListener('click', function(e) {
    e.stopPropagation();
    selectOptions.classList.toggle('show');
  });

  document.addEventListener('click', function() {
    selectOptions.classList.remove('show');
  });

  // 单独绑定，杜绝兼容性报错
  const optionDivs = selectOptions.querySelectorAll('div[data-size]');
  optionDivs.forEach(div => {
    div.addEventListener('click', function(e) {
      e.stopPropagation();
      
      optionDivs.forEach(c => c.classList.remove('selected'));
      this.classList.add('selected');
      
      size = Number(this.dataset.size);
      selectTrigger.textContent = size + ' × ' + size;
      
      selectOptions.classList.remove('show');
      newGame();
    });
  });

  /* ---------- 工具 ---------- */
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  /* ---------- 记录存储 ---------- */
  function storageKey() { return mode === 'drift' ? 'schulte-records-drift-v1' : STORAGE_KEY; }

  function loadRecords() {
    try {
      const raw = localStorage.getItem(storageKey());
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(r => r && typeof r.ms === 'number') : [];
    } catch (e) { return []; }
  }

  function saveRecords(list) {
    const grouped = {};
    list.forEach(r => {
      (grouped[r.size] = grouped[r.size] || []).push(r);
    });
    const kept = [];
    Object.keys(grouped).forEach(k => {
      grouped[k].sort((a, b) => a.ms - b.ms);
      kept.push.apply(kept, grouped[k].slice(0, MAX_RECORDS));
    });
    try {
      localStorage.setItem(storageKey(), JSON.stringify(kept));
    } catch (e) { /* ignore */ }
  }

  function renderRecords() {
    recordSizeLabel.textContent = (mode === 'drift' ? '漂浮 · ' : '') + size + ' × ' + size;
    const list = loadRecords()
      .filter(r => r.size === size)
      .sort((a, b) => a.ms - b.ms)
      .slice(0, MAX_RECORDS);

    bestRecordEl.classList.toggle('empty', !list.length);
    bestRecordEl.innerHTML = list.length
      ? '<span class="best-time">' + fmtSec(list[0].ms) + '</span><span class="best-meta">s · ' + (list[0].errors ? list[0].errors + '误点' : '全对') + '</span>'
      : '暂无记录';

    if (!list.length) {
      recordsEl.innerHTML = '<li class="empty">暂无记录</li>';
      return;
    }

    recordsEl.innerHTML = list.map(function (r, i) {
      const d = new Date(r.ts);
      const pad = n => String(n).padStart(2, '0');
      const dateStr = d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      const isNew = r.ts === newRecordTs ? ' class="new"' : '';
      const meta = r.errors ? r.errors + '误点' : '全对';
      return '<li' + isNew + '>' +
        '<span class="rank">' + (i + 1) + '</span>' +
        '<span class="rtime">' + fmtSec(r.ms) + 's</span>' +
        '<span class="rmeta">' + meta + '</span>' +
        '<span class="rdate">' + dateStr + '</span>' +
        '</li>';
    }).join('');
  }

  /* ---------- 游戏核心 ---------- */
  function newGame() {
    cancelAnimationFrame(rafId);
    if (drift) { drift.destroy(); drift = null; }
    total = size * size;
    next = 1;
    errors = 0;
    started = false;
    finished = false;
    newRecordTs = 0;
    updateTimerVisibility();

    timerEl.textContent = '0.00';
    nextEl.textContent = '1';
    errorsEl.textContent = '0';
    boardWrapper.classList.remove('solved');

    boardEl.style.setProperty('--size', size);

    const nums = shuffle(Array.from({ length: total }, (_, i) => i + 1));
    if (mode === 'drift') {
      boardEl.innerHTML = '';
      drift = new DriftField(arena, nums, onCellClick);
      renderRecords();
      return;
    }
    const frag = document.createDocumentFragment();
    
    nums.forEach(function (n) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cell';
      b.textContent = n;
      b.dataset.n = n;
      b.addEventListener('click', onCellClick);
      frag.appendChild(b);
    });

    boardEl.innerHTML = '';
    boardEl.appendChild(frag);
    renderRecords();
  }

  function onCellClick(e) {
    if (finished) return;
    const btn = e.currentTarget;
    const n = Number(btn.dataset.n);

    if (n !== next) {
      errors++;
      errorsEl.textContent = errors;
      btn.classList.remove('wrong');
      void btn.offsetWidth;
      btn.classList.add('wrong');
      setTimeout(() => btn.classList.remove('wrong'), 400);
      return;
    }

    if (!started) {
      started = true;
      startTime = performance.now();
      tick();
    }

    btn.classList.add('done');
    btn.disabled = true;
    if (drift) drift.remove(n);
    next++;

    if (next > total) {
      finish();
    } else {
      nextEl.textContent = next;
    }
  }

  function tick() {
    timerEl.textContent = fmtSec(performance.now() - startTime);
    rafId = requestAnimationFrame(tick);
  }

  function finish() {
    finished = true;
    if (drift) drift.stop();
    updateTimerVisibility(true);
    cancelAnimationFrame(rafId);

    const ms = performance.now() - startTime;
    timerEl.textContent = fmtSec(ms);
    nextEl.textContent = 'OK';
    boardWrapper.classList.add('solved');

    const record = { ms: Math.round(ms), ts: Date.now(), size: size, errors: errors };
    newRecordTs = record.ts;

    const all = loadRecords();
    const previous = all.filter(r => r.size === size);
    const isFirst = previous.length === 0;
    const isNewBest = !isFirst && record.ms < Math.min(...previous.map(r => r.ms));
    all.push(record);
    saveRecords(all);
    renderRecords();

    const achievement = isFirst ? '，首次纪录已诞生！' : isNewBest ? '，刷新纪录！🎉' : '';
    toast('通关！用时 ' + fmtSec(ms) + ' 秒' + achievement);
  }

  /* ---------- 模式切换 ---------- */
  modeSwitch.addEventListener('click', function () {
    mode = mode === 'classic' ? 'drift' : 'classic';
    const floating = mode === 'drift';
    modeSwitch.setAttribute('aria-checked', String(floating));
    document.querySelector('.app').classList.toggle('drift-mode', floating);
    driftHud.hidden = !floating;
    if (floating) {
      driftHud.append(timerToggle, statsEl, bestSummary);
      if (size > 6) size = 6;
    } else {
      classicScreenTop.appendChild(timerToggle);
      classicPlayfield.appendChild(statsEl);
      classicScreen.appendChild(bestSummary);
    }
    optionDivs.forEach(div => {
      div.hidden = floating && Number(div.dataset.size) > 6;
      div.classList.toggle('selected', Number(div.dataset.size) === size);
    });
    selectTrigger.textContent = size + ' × ' + size;
    newGame();
  });
  document.addEventListener('visibilitychange', () => {
    if (drift) drift.resetClock();
  });

  /* ---------- 绑定 ---------- */
  restartBtn.addEventListener('click', newGame);

  clearBtn.addEventListener('click', function () {
    if (!confirm('确定清空 ' + size + '×' + size + ' 的记录吗？')) return;
    const kept = loadRecords().filter(r => r.size !== size);
    try { localStorage.setItem(storageKey(), JSON.stringify(kept)); } catch (e) {}
    newRecordTs = 0;
    renderRecords();
    toast('已清空');
  });

  document.addEventListener('keydown', function (e) {
    if (recordsDialog.open || e.target === timerToggle || timerToggle.contains(e.target) || e.target === modeSwitch) return;
    if (e.key === 'r' || e.key === 'R' || e.key === ' ') {
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      e.preventDefault();
      newGame();
    }
  });

  newGame();
})();
</script></body></html>
